[package]
name = "polyloupe-core"
version = "0.2.1"
edition = "2024"
description = "Scene model and file format loaders shared by PolyLoupe and its Explorer thumbnail handler"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.23.1"
glam = "0.33.10"
gltf = { version = "1.4.1", features = ["KHR_texture_transform"] }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "exr", "gif", "hdr", "jpeg", "png", "tga", "webp"] }
log = "0.4.34"
mikktspace = "0.3.0"
roxmltree = "0.20"
# glTF JSON is patched before the gltf crate sees it (see `open_gltf`).
serde_json = "1"
stl_io = "0.11.0"
ufbx = "0.11.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
meshopt = "0.6.2"
