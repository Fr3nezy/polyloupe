[package]
name = "polyloupe-thumbs"
version = "0.1.1"
edition = "2024"
description = "Windows Explorer thumbnail handler for PolyLoupe"
license = "GPL-3.0-or-later"

[lib]
name = "polyloupe_thumbs"
crate-type = ["cdylib"]

[dependencies]
# Reads back the PNG that `polyloupe.exe --thumbnail` writes for the path handler.
image = { version = "0.25", default-features = false, features = ["png"] }
polyloupe-core = { path = "../core" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

